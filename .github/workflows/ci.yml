name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/validate_skill.py

  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: skills/show-your-receipts/scripts/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: skills/show-your-receipts/scripts/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: skills/show-your-receipts/scripts
      - run: python -m pip install -r skills/show-your-receipts/scripts/requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/syr-pycache

  ci:
    if: always()
    needs: [validate, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          TEST_RESULT: ${{ needs.tests.result }}
        run: |
          test "$VALIDATE_RESULT" = success
          test "$TEST_RESULT" = success

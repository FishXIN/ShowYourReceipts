<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="500" viewBox="0 0 1440 500" role="img" aria-labelledby="title desc">
  <title id="title">From a research question to a Word report and original PDFs</title>
  <desc id="desc">The agent defines the research question, finds eligible papers, traces citations to original studies, checks passages in context, then delivers a minimal Word report and evidence ZIP.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#6b7372" stroke-width="1.5"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#182725}
      .eyebrow{font-size:14px;letter-spacing:2px;font-weight:700;fill:#3b7868}
      .heading{font-size:34px;font-weight:700}
      .sub{font-size:20px;fill:#566762}
      .step{font-size:14px;fill:#64766e;font-weight:700}
      .label{font-size:24px;font-weight:700}
      .detail{font-size:17px;fill:#53645e}
      .icon{fill:none;stroke:#245f4c;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1440" height="500" rx="20" fill="#f6faf8"/>
  <text class="eyebrow" x="48" y="44">SHOWYOURRECEIPTS / THE WORKFLOW</text>
  <text class="heading" x="48" y="99">Less paper chasing. More research.</text>
  <text class="sub" x="48" y="137">Give your agent a question. Get the passages, the context, and the files.</text>
  <g stroke="#6b7372" stroke-width="2" marker-end="url(#arrow)">
    <path d="M293 278H310"/><path d="M566 278H583"/>
    <path d="M839 278H856"/><path d="M1112 278H1129"/>
  </g>
  <g transform="translate(48 181)">
    <rect width="236" height="211" rx="12" fill="#fff" stroke="#d9e6df"/>
    <text class="step" x="22" y="31">01 / DEFINE</text>
    <g class="icon" transform="translate(22 52)"><path d="M0 0h31l12 12v39H0zM31 0v12h12M9 23h24M9 33h18M9 43h23"/></g>
    <text class="label" x="22" y="135">Your question</text>
    <text class="detail" x="22" y="165">A claim, manuscript</text>
    <text class="detail" x="22" y="188">or experiment step.</text>
  </g>
  <g transform="translate(321 181)">
    <rect width="236" height="211" rx="12" fill="#fff" stroke="#d9e6df"/>
    <text class="step" x="22" y="31">02 / FIND</text>
    <g class="icon" transform="translate(22 52)"><rect x="0" y="0" width="33" height="44" rx="2"/><path d="M8 10h17M8 18h12M8 26h9"/><circle cx="33" cy="34" r="12"/><path d="m42 43 10 10"/></g>
    <text class="label" x="22" y="135">Eligible papers</text>
    <text class="detail" x="22" y="165">Check core coverage</text>
    <text class="detail" x="22" y="188">and read the abstract.</text>
  </g>
  <g transform="translate(594 181)">
    <rect width="236" height="211" rx="12" fill="#fff" stroke="#d9e6df"/>
    <text class="step" x="22" y="31">03 / TRACE</text>
    <g class="icon" transform="translate(22 52)"><rect width="18" height="24" rx="2"/><rect x="32" y="28" width="18" height="24" rx="2"/><path d="M18 12h23v16M36 23l5 5 5-5M5 7h8M37 36h8M37 43h8"/></g>
    <text class="label" x="22" y="135">The real origin</text>
    <text class="detail" x="22" y="165">Follow citations until</text>
    <text class="detail" x="22" y="188">the source is resolved.</text>
  </g>
  <g transform="translate(867 181)">
    <rect width="236" height="211" rx="12" fill="#fff" stroke="#d9e6df"/>
    <text class="step" x="22" y="31">04 / CHECK</text>
    <g class="icon" transform="translate(22 52)"><rect width="44" height="52" rx="2"/><path d="M8 10h28M8 20h28M8 30h28M8 40h18"/></g>
    <path d="M897 265h28" stroke="#dc3340" stroke-width="3"/>
    <text class="label" x="22" y="135">Quote + context</text>
    <text class="detail" x="22" y="165">Keep qualifiers, limits</text>
    <text class="detail" x="22" y="188">and exact locations.</text>
  </g>
  <g transform="translate(1140 181)">
    <rect width="252" height="211" rx="12" fill="#e8f3ed" stroke="#bfd6c8"/>
    <text class="step" x="22" y="31">05 / DELIVER</text>
    <g class="icon" transform="translate(22 52)"><path d="M0 0h31l12 12v39H0zM31 0v12h12M8 23h25M8 32h25M8 41h15M54 11h23v40H54zM65 15v31M62 20h6M62 28h6M62 36h6"/></g>
    <text class="label" x="22" y="135">Word + PDF ZIP</text>
    <text class="detail" x="22" y="165">One simple report.</text>
    <text class="detail" x="22" y="188">All the original files.</text>
  </g>
  <path d="M48 428H1392" stroke="#d9e6df"/>
  <circle cx="56" cy="461" r="5" fill="#3b7868"/>
  <text class="detail" x="73" y="467">Search and semantic review: your agent. File checks, underlines and Word output: the local helper.</text>
</svg>
